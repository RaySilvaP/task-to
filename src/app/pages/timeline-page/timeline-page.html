<div
  #timeline
  class="timeline-container"
  [style.height.px]="24 * 60 * pixelsPerMinute"
>
  <div class="timeline-wrapper">
    @for(hour of hours; track hour) {
      <div class="hour-mark">
        <span class="hour-number">{{hour}}</span>
        <div class="hour-line"></div>
      </div>
    }
  </div>

  <div
  class="time-block"
  cdkDrag
  cdkDragBoundary=".timeline-container"
  cdkDragLockAxis="y"
  [cdkDragConstrainPosition]="contrainPosition(pixelsPerMinute)"
  (cdkDragEnded)="onDragEnd($event)"
  [style.top.px]="block().start * pixelsPerMinute"
  [style.height.px]="block().duration * pixelsPerMinute"
  >
  fazer alguma coisa
  </div>
</div>
