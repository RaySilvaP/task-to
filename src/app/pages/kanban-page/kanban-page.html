<div class="context-header">
  <app-select
    class="context-selector"
    [ngModel]="selectedContextId()"
    (ngModelChange)="onSelectContext($event)"
    placeholder="Select a context"
  >
    @for(context of contexts(); track context.id) {
      <option [value]="context.id">{{ context.name }}</option>
    }
  </app-select>
  @if(selectedContext()) {
    <app-button class="edit-context-btn" variant="secondary" (click)="isModalOpen.set(true)">Edit Context</app-button>
  }
</div>

<app-kanban-board />
<app-kanban-action-button />

@if(isModalOpen()) {
  <app-modal-context 
    [context]="selectedContext()" 
    type="edit" 
    (close)="isModalOpen.set(false)" 
    (submit)="onEditContext($event)" 
    (delete)="showPromptModal.set($event)"
  />
}

@if(showPromptModal() !== null) {
  <app-modal-prompt 
    prompt="Deleting the context will also delete the columns and tasks." 
    (cancel)="showPromptModal.set(null)"
    (confirm)="onDeleteContext(showPromptModal()!)"
    confirmText="Delete"
  />
}
