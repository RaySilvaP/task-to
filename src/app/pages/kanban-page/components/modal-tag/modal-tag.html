<app-modal title="Tag" (close)="close.emit()">
  <form [formGroup]="tagForm">
    @if(filteredTags().length > 0) {
      <label class="color-label">Suggestions</label>
      <div class="tag-list">
        @for(mock of filteredTags(); track mock.id) {
          <app-tag-component [tag]="mock" (click)="selectTag(mock)"/>
        }
      </div>
    }

    <label class="color-label">Color</label>
    <div class="color-grid">
      @for(color of colors; track color) {
        <button
          type="button"
          class="color-swatch"
          [class.selected]="tagForm.get('color')?.value === color"
          [style.background]="color"
          (click)="selectColor(color)"
        ></button>
      }
    </div>

    <app-input-field label="Name" type="text" formControlName="name" />
  </form>

  <app-modal-footer modal-footer>
    @if(selectedTag) {
      <app-button (click)="showPromptModal.set(true)" variant="danger">Delete</app-button>
    }
    <app-button [disabled]="tagForm.invalid" (click)="onSubmit()" variant="primary">Confirm</app-button>
  </app-modal-footer>
</app-modal>

@if(showPromptModal()) {
  <app-modal-prompt 
    prompt="Deleting the tag will remove it from all the tasks."
    (cancel)="showPromptModal.set(false)"
    (confirm)="onDelete()"
    confirmText="Delete"
  />
}
