<app-modal [title]="type() == 'create' ? 'Create Kanban Column' : 'Edit Kanban Column'" (close)="close.emit()">
  <form [formGroup]="kanbanColumnForm">
    <app-input-field label="Name*" type="text" formControlName="name" />
  </form>

  <app-modal-footer modal-footer>
    @if(type() === 'edit') {
    <app-button (click)="onDelete()" variant="danger">Delete</app-button>
    }
    <app-button [disabled]="kanbanColumnForm.invalid" (click)="onSubmitForm()" variant="primary">
      Confirm
    </app-button>
  </app-modal-footer>
</app-modal>
